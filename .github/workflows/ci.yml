# CI matrix per docs/ARCHITECTURE.md #Build: Linux (GCC, GUI built) and
# Windows (MSVC). Both configure + build + ctest.
name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - name: Build and test
        run: ./scripts/build.sh build-ci
      - name: Assert GUI was built
        run: test -x build-ci/lexe-installer
      - name: Headless GUI smoke test (warning-clean, markup-safe)
        run: ./scripts/gui-smoke.sh build-ci

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-ci --config Release
      - name: Test
        run: ctest --test-dir build-ci -C Release --output-on-failure

  # Cross-distribution portability proof (Tux32 Core 1): builds the runtime and
  # a dynamically linked reference app in a glibc-2.31 sysroot, shows the
  # verifier reject a newer-host build (and that build genuinely failing to load
  # on glibc 2.31), then installs and LAUNCHES the one signed artifact under the
  # isolation sandbox on a fresh, older, different-distro host. podman runs
  # --privileged so bubblewrap's nested user namespaces work.
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Prove cross-distribution portability
        run: CONTAINER=podman ./scripts/portability-demo.sh
